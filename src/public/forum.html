<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Forum - Accueil</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/forum.css">
</head>
<body>
    <div id="notification-container" class="notification-container"></div>

    <header class="navbar forum-navbar">
        <a href="/forum.html" class="netflix-logo">NETFLIX FORUM</a>
        <div class="user-controls">
            <div class="user-profile">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Avatar" class="avatar">
                <span id="current-username">...</span>
            </div>
            <button id="btn-create-topic" class="btn-red small-btn">+ Nouveau Topic</button>
            <button id="btn-logout" class="btn-outline">Déconnexion</button>
        </div>
    </header>

    <main class="forum-container">
        <!-- SECTION RECHERCHE ET TAGS (F-10 & F-12) -->
        <section class="tags-section">
            <h2 class="section-title">Parcourir le forum</h2>
            
            <div class="search-container">
                <input type="text" id="search-input" class="search-bar" placeholder="Rechercher un topic par titre...">
            </div>

            <div class="tags-list" id="tags-container">
                <button class="tag-btn active" data-tag="all">Général</button>
                <button class="tag-btn" data-tag="Séries">Séries</button>
                <button class="tag-btn" data-tag="Films">Films</button>
                <button class="tag-btn" data-tag="Théories">Théories</button>
            </div>
        </section>

        <section class="topics-section">
            <h2 class="section-title">Discussions récentes</h2>
            <div class="topics-grid" id="topics-container">
                <p style="color: #b3b3b3; text-align: center; width: 100%;">Chargement des topics...</p>
            </div>
        </section>
    </main>

    <!-- MODALE DE CRÉATION -->
    <div id="topic-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <h2>Lancer une discussion</h2>
<!-- Dans la modale "topic-modal" -->
<form id="create-topic-form">
    <input type="text" id="topic-title" class="modal-input-title" placeholder="Titre de la discussion" required>
    
    <!-- NOUVEAU : Choix de la catégorie -->
    <select id="topic-tag" class="modal-input-title" style="margin-top: 15px; background-color: #333; color: white; border: 1px solid #444;">
        <option value="Général">Général</option>
        <option value="Séries">Séries</option>
        <option value="Films">Films</option>
        <option value="Théories">Théories</option>
    </select>

    <textarea id="topic-body" class="modal-textarea" placeholder="De quoi voulez-vous parler ?" required></textarea>
    
    <div class="modal-actions">
        <button type="button" id="cancel-modal" class="btn-outline">Annuler</button>
        <button type="submit" class="btn-red">Publier</button>
    </div>
</form>
        </div>
    </div>

    <script src="/js/forum.js"></script>
</body>
</html>
